name: Test examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: Run both metered native accessibility benchmarks on run.cloud
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            sdk-ios-android/package-lock.json
            ios-app-screenshot/package-lock.json
            android-app-screenshot/package-lock.json
            accessibility-benchmark/package-lock.json
            live-camera-relay/package-lock.json

      - name: Install published-package test dependencies
        working-directory: tests
        run: npm ci

      - name: Install SDK example dependencies
        working-directory: sdk-ios-android
        run: npm ci

      - name: Install iOS screenshot dependencies
        working-directory: ios-app-screenshot
        run: npm ci

      - name: Install Android screenshot dependencies
        working-directory: android-app-screenshot
        run: npm ci

      - name: Install accessibility benchmark dependencies
        working-directory: accessibility-benchmark
        run: npm ci

      - name: Install camera example dependencies
        working-directory: live-camera-relay
        run: npm ci

      - name: Test published onboarding artifacts
        working-directory: tests
        run: npm test

      - name: Test SDK example
        working-directory: sdk-ios-android
        run: npm test

      - name: Test iOS screenshot example
        working-directory: ios-app-screenshot
        run: npm test

      - name: Test Android screenshot example
        working-directory: android-app-screenshot
        run: npm test

      - name: Test native accessibility benchmark contracts
        working-directory: accessibility-benchmark
        run: npm test

      - name: Test mosaic example
        working-directory: eight-device-mosaic
        run: npm test

      - name: Test camera example
        working-directory: live-camera-relay
        run: npm test

      - name: Typecheck camera app
        working-directory: live-camera-relay
        run: npm run typecheck

  native-app-build:
    name: Build ${{ matrix.platform }} benchmark app
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-14
            directory: ios-app-screenshot
            artifact: run-cloud-parity-ios-app
            artifact-path: ios-app-screenshot/build/RunCloudProof.app.tar.gz
          - platform: android
            runner: ubuntu-latest
            directory: android-app-screenshot
            artifact: run-cloud-parity-android-app
            artifact-path: android-app-screenshot/build/RunCloudProof.apk
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build native app
        working-directory: ${{ matrix.directory }}
        run: npm run build:app

      - name: Upload native app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  live:
    name: Live iOS + Android accessibility benchmark on run.cloud
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.live == true
    needs: [test, native-app-build]
    timeout-minutes: 45
    environment: live
    runs-on: ubuntu-latest
    concurrency:
      group: run-cloud-accessibility-benchmark-live
      cancel-in-progress: false
    env:
      RUN_CLOUD_API_URL: ${{ secrets.RUN_CLOUD_API_URL }}
      RUN_CLOUD_SDK_VERSION: "0.22.0"
      RUN_CLOUD_IMAGE: runcloud/agent-base
      RUN_CLOUD_CPU: "2"
      RUN_CLOUD_MEMORY: "4096"
      RUN_CLOUD_TIMEOUT_SECONDS: "1800"
      RUN_CLOUD_ENVIRONMENT_TTL_SECONDS: "2100"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download CI-built iOS benchmark app
        uses: actions/download-artifact@v4
        with:
          name: run-cloud-parity-ios-app
          path: ${{ runner.temp }}/ios-benchmark-app

      - name: Download CI-built Android benchmark app
        uses: actions/download-artifact@v4
        with:
          name: run-cloud-parity-android-app
          path: ${{ runner.temp }}/android-benchmark-app

      # Keep Actions as the controller so workflow_dispatch, environment
      # secrets, logs, summaries, and artifacts retain their normal semantics.
      # The benchmark itself runs in the short-lived run.cloud sandbox below.
      - name: Prepare run.cloud runner inputs
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/runcloud-accessibility-results"
          state_path="$RUNNER_TEMP/runcloud-accessibility-runner-state.json"
          mkdir -p "$results_dir"
          printf '%s\n' \
            '{"schemaVersion":1,"status":"controller-prepared"}' \
            > "$results_dir/controller-prepared.json"
          source_archive="$RUNNER_TEMP/run-cloud-accessibility-source.tar.gz"
          tar -czf "$source_archive" accessibility-benchmark
          {
            echo "RUN_CLOUD_BENCHMARK_RESULTS_DIR=$results_dir"
            echo "RUN_CLOUD_BENCHMARK_STATE_PATH=$state_path"
            echo "RUN_CLOUD_BENCHMARK_SOURCE_ARCHIVE=$source_archive"
            echo "RUN_CLOUD_BENCHMARK_IOS_APP=$RUNNER_TEMP/ios-benchmark-app/RunCloudProof.app.tar.gz"
            echo "RUN_CLOUD_BENCHMARK_ANDROID_APP=$RUNNER_TEMP/android-benchmark-app/RunCloudProof.apk"
          } >> "$GITHUB_ENV"

      - name: Install pinned public run.cloud SDK
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/runcloud-sdk"
          npm install \
            --prefix "$sdk_dir" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            @run-cloud/sdk@0.22.0
          sdk_path="$sdk_dir/node_modules/@run-cloud/sdk/dist/index.js"
          actual_version="$(node -p "require('$sdk_dir/node_modules/@run-cloud/sdk/package.json').version")"
          test -f "$sdk_path"
          test "$actual_version" = "$RUN_CLOUD_SDK_VERSION"
          echo "RUN_CLOUD_SDK_PATH=$sdk_path" >> "$GITHUB_ENV"
          echo "Using public @run-cloud/sdk@$actual_version"

      - name: Validate live run.cloud configuration
        env:
          RUN_CLOUD_API_KEY: ${{ secrets.RUN_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_CLOUD_API_KEY:-}" ]; then
            echo "::error::The live environment is missing RUN_CLOUD_API_KEY."
            exit 1
          fi
          if [ -z "${RUN_CLOUD_API_URL:-}" ]; then
            echo "::error::The live environment is missing RUN_CLOUD_API_URL."
            exit 1
          fi
          test -f "$RUN_CLOUD_BENCHMARK_SOURCE_ARCHIVE"
          test -f "$RUN_CLOUD_BENCHMARK_IOS_APP"
          test -f "$RUN_CLOUD_BENCHMARK_ANDROID_APP"
          test -f "$RUN_CLOUD_SDK_PATH"

      - name: Run published-SDK benchmark on run.cloud
        env:
          RUN_CLOUD_API_KEY: ${{ secrets.RUN_CLOUD_API_KEY }}
        run: node scripts/runcloud-accessibility-runner.mjs

      - name: Confirm run.cloud cleanup
        if: ${{ always() }}
        env:
          RUN_CLOUD_API_KEY: ${{ secrets.RUN_CLOUD_API_KEY }}
        run: |
          if [ -z "${RUN_CLOUD_API_KEY:-}" ] || [ ! -f "${RUN_CLOUD_SDK_PATH:-}" ]; then
            echo "Cleanup skipped because no run.cloud runner could have been created."
            exit 0
          fi
          node scripts/runcloud-accessibility-runner.mjs --cleanup

      - name: Upload accessibility benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-cloud-accessibility-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runcloud-accessibility-results
          if-no-files-found: error
          retention-days: 14
