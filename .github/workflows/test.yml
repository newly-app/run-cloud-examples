name: Test examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: Build and execute both metered screenshot examples
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            sdk-ios-android/package-lock.json
            ios-app-screenshot/package-lock.json
            android-app-screenshot/package-lock.json
            live-camera-relay/package-lock.json

      - name: Install published-package test dependencies
        working-directory: tests
        run: npm ci

      - name: Install SDK example dependencies
        working-directory: sdk-ios-android
        run: npm ci

      - name: Install iOS screenshot dependencies
        working-directory: ios-app-screenshot
        run: npm ci

      - name: Install Android screenshot dependencies
        working-directory: android-app-screenshot
        run: npm ci

      - name: Install camera example dependencies
        working-directory: live-camera-relay
        run: npm ci

      - name: Test published onboarding artifacts
        working-directory: tests
        run: npm test

      - name: Test SDK example
        working-directory: sdk-ios-android
        run: npm test

      - name: Test iOS screenshot example
        working-directory: ios-app-screenshot
        run: npm test

      - name: Test Android screenshot example
        working-directory: android-app-screenshot
        run: npm test

      - name: Test mosaic example
        working-directory: eight-device-mosaic
        run: npm test

      - name: Test camera example
        working-directory: live-camera-relay
        run: npm test

      - name: Typecheck camera app
        working-directory: live-camera-relay
        run: npm run typecheck

  native-app-build:
    name: Build ${{ matrix.platform }} sample app
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-14
            directory: ios-app-screenshot
            artifact: run-cloud-parity-ios-app
            artifact-path: ios-app-screenshot/build/RunCloudProof.app.tar.gz
          - platform: android
            runner: ubuntu-latest
            directory: android-app-screenshot
            artifact: run-cloud-parity-android-app
            artifact-path: android-app-screenshot/build/RunCloudProof.apk
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Build native app
        working-directory: ${{ matrix.directory }}
        run: npm run build:app

      - name: Upload native app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  live:
    name: Live ${{ matrix.platform }} screenshot
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: [test, native-app-build]
    timeout-minutes: 10
    environment: live
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-14
            directory: ios-app-screenshot
            artifact: run-cloud-parity-ios-app
            artifact-file: RunCloudProof.app.tar.gz
          - platform: android
            runner: ubuntu-latest
            directory: android-app-screenshot
            artifact: run-cloud-parity-android-app
            artifact-file: RunCloudProof.apk
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install published SDK
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Download CI-built native app
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/native-app

      - name: Upload and capture the CI-built native app
        working-directory: ${{ matrix.directory }}
        env:
          RUN_CLOUD_API_KEY: ${{ secrets.RUN_CLOUD_API_KEY }}
        run: >-
          npm run demo --
          --app "$RUNNER_TEMP/native-app/${{ matrix.artifact-file }}"
          --output "$RUNNER_TEMP/${{ matrix.platform }}-run-cloud-proof.png"
          --json

      - name: Upload screenshot proof
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-run-cloud-proof
          path: ${{ runner.temp }}/${{ matrix.platform }}-run-cloud-proof.png
          if-no-files-found: error
